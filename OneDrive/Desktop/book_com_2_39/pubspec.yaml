name: book_com
description: A cross-platform Bookstore app built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  provider: ^6.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Network
  dio: ^5.3.2
  connectivity_plus: ^5.0.2
  
  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  
  # Utils
  flutter_screenutil: ^5.9.0
  permission_handler: ^11.0.1
  sensors_plus: ^3.1.0
  
  # Payment
  # stripe_payment: ^1.1.4  # Commented out due to compatibility issues
  
  # Image
  image_picker: ^1.0.4
  
  # Date
  intl: ^0.18.1
  
  # Animation
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  bloc_test: ^9.1.4
  mockito: ^5.4.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
